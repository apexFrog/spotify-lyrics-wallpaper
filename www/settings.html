<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Settings — Spotify Lyrics Wallpaper</title>
<style>
  :root {
    --bg: #121216;
    --sidebar: #18181f;
    --card: #1e1e27;
    --card-hover: #252530;
    --border: rgba(255, 255, 255, 0.08);
    --text: #f2f3f7;
    --muted: #989aa8;
    --accent: #1ed760;
    --accent-soft: rgba(30, 215, 96, 0.16);
    --danger: #ff5c6c;
    --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%; background: var(--bg); color: var(--text);
    font: 13.5px/1.45 "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
    user-select: none; overflow: hidden;
  }
  .layout { display: flex; height: 100%; }

  /* Sidebar */
  .sidebar {
    width: 255px; flex: 0 0 255px; background: var(--sidebar);
    border-right: 1px solid var(--border); display: flex; flex-direction: column;
    padding: 14px 10px; gap: 10px;
  }
  .brand {
    display: flex; align-items: center; gap: 10px; padding: 4px 8px 6px;
  }
  .brand-dot {
    width: 28px; height: 28px; border-radius: 50%;
    background: linear-gradient(135deg, #1ed760, #1496e6);
    display: grid; place-items: center; font-weight: 800; font-size: 13px; color: #0b1114;
    flex-shrink: 0;
  }
  .brand-title { font-weight: 700; font-size: 14px; letter-spacing: -0.01em; }
  .brand-sub { font-size: 11px; color: var(--muted); }

  .search {
    width: 100%; padding: 8px 11px; border-radius: 9px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text);
    font: inherit; outline: none; transition: border-color .15s;
  }
  .search:focus { border-color: var(--accent); }
  .search::placeholder { color: var(--muted); }

  .nav { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; padding-right: 2px; }
  .nav-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 11px; border-radius: 9px; cursor: pointer;
    color: var(--muted); font-weight: 500; transition: background .15s, color .15s;
  }
  .nav-item:hover { background: rgba(255,255,255,0.05); color: var(--text); }
  .nav-item.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .nav-badge {
    font-size: 11px; padding: 1px 6px; border-radius: 99px;
    background: rgba(255,255,255,0.08); color: var(--muted);
  }
  .nav-item.active .nav-badge { background: rgba(30,215,96,0.22); color: var(--accent); }
  .nav-sep { height: 1px; background: var(--border); margin: 6px 6px; }

  .sidebar-foot {
    display: flex; gap: 6px; padding-top: 8px; border-top: 1px solid var(--border);
  }
  .btn {
    flex: 1; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--card); color: var(--text); font: 12px/1.2 inherit; font-weight: 600;
    cursor: pointer; transition: background .15s, border-color .15s; white-space: nowrap;
  }
  .btn:hover { background: var(--card-hover); border-color: rgba(255,255,255,0.16); }
  .btn.danger { color: var(--danger); }
  .btn.primary { background: var(--accent); color: #0a140d; border-color: transparent; }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn.inline { flex: 0 0 auto; padding: 7px 13px; }

  /* Content */
  .main { flex: 1; overflow-y: auto; padding: 22px 26px 40px; }
  .section-head {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    margin-bottom: 16px;
  }
  .section-title { font-size: 20px; font-weight: 700; margin-bottom: 16px; letter-spacing: -0.02em; }
  .section-head .section-title { margin-bottom: 0; }
  .group-heading {
    font-size: 12px; text-transform: uppercase; letter-spacing: .07em;
    color: var(--muted); font-weight: 700; margin: 16px 0 8px 2px;
  }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    overflow: hidden;
  }
  .row {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 12px 15px; border-bottom: 1px solid var(--border);
  }
  .row:last-child { border-bottom: none; }
  .row-label { flex: 1; min-width: 0; }
  .row-name { font-weight: 500; color: var(--text); }
  .row-hint { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  .row-ctrl { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }

  /* Controls */
  select, input[type="text"] {
    min-width: 210px; max-width: 290px; padding: 7px 10px; border-radius: 8px;
    border: 1px solid var(--border); background: #14141a; color: var(--text);
    font: inherit; outline: none;
  }
  select { cursor: pointer; }
  select:focus, input[type="text"]:focus { border-color: var(--accent); }

  .slider-wrap { display: flex; align-items: center; gap: 10px; }
  input[type="range"] { width: 165px; accent-color: var(--accent); cursor: pointer; }
  .num-val {
    width: 62px; padding: 5px 7px; border-radius: 7px; text-align: right;
    border: 1px solid var(--border); background: #14141a; color: var(--text);
    font: 12.5px/1.2 "Consolas", monospace; outline: none;
  }
  .num-val:focus { border-color: var(--accent); }

  /* Toggle switch */
  .switch { position: relative; width: 42px; height: 24px; display: inline-block; cursor: pointer; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch-track {
    position: absolute; inset: 0; border-radius: 99px; background: #323342;
    transition: background .18s;
  }
  .switch-track::after {
    content: ""; position: absolute; left: 3px; top: 3px; width: 18px; height: 18px;
    border-radius: 50%; background: #fff; transition: transform .18s;
  }
  .switch input:checked + .switch-track { background: var(--accent); }
  .switch input:checked + .switch-track::after { transform: translateX(18px); }

  /* Color picker */
  .color-wrap { display: flex; align-items: center; gap: 8px; }
  input[type="color"] {
    width: 34px; height: 28px; border: 1px solid var(--border); border-radius: 7px;
    background: transparent; cursor: pointer; padding: 2px;
  }
  .hex-badge { font: 12px/1 "Consolas", monospace; color: var(--muted); min-width: 60px; }

  /* File picker */
  .file-wrap { display: flex; align-items: center; gap: 6px; max-width: 320px; }
  .file-path {
    max-width: 170px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-size: 12px; color: var(--muted);
  }

  /* Presets Gallery (Wallpaper Engine Playlist style: rectangles with photo inside) */
  .preset-creator {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px 16px; margin-bottom: 18px; display: flex; align-items: center; gap: 14px;
  }
  .creator-thumb {
    width: 96px; height: 64px; border-radius: 8px; flex-shrink: 0;
    background: linear-gradient(135deg, #252533, #17171f);
    border: 1px dashed rgba(255,255,255,0.2); overflow: hidden; cursor: pointer;
    display: flex; align-items: center; justify-content: center; text-align: center;
    font-size: 11px; color: var(--muted); padding: 4px; position: relative;
    transition: border-color .15s;
  }
  .creator-thumb:hover { border-color: var(--accent); color: var(--text); }
  .creator-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .creator-fields { flex: 1; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .creator-row { display: flex; gap: 8px; align-items: center; }
  .creator-row input[type="text"] { flex: 1; max-width: none; min-width: 0; }
  .creator-hint { font-size: 11.5px; color: var(--muted); }

  .preset-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(168px, 1fr));
    gap: 14px;
  }
  .preset-tile {
    position: relative; aspect-ratio: 4 / 3; border-radius: 10px; overflow: hidden;
    background: linear-gradient(135deg, #242434, #171720);
    border: 2px solid rgba(255,255,255,0.08);
    box-shadow: 0 6px 18px rgba(0,0,0,0.42);
    cursor: pointer; transition: transform .16s ease, border-color .16s ease, box-shadow .16s ease;
  }
  .preset-tile:hover {
    transform: translateY(-2px);
    border-color: rgba(255,255,255,0.32);
    box-shadow: 0 10px 24px rgba(0,0,0,0.55);
  }
  .preset-tile.active {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px rgba(30,215,96,0.25), 0 8px 22px rgba(0,0,0,0.5);
  }
  .preset-tile img {
    width: 100%; height: 100%; object-fit: cover; display: block;
    transition: transform .25s ease;
  }
  .preset-tile:hover img { transform: scale(1.04); }
  .preset-placeholder {
    width: 100%; height: 100%; display: grid; place-items: center;
    font-size: 28px; color: rgba(255,255,255,0.22);
    background: radial-gradient(circle at 30% 30%, rgba(30,215,96,0.18), transparent 60%),
                linear-gradient(135deg, #232334, #14141c);
  }
  .preset-caption {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 20px 10px 8px;
    background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.45) 60%, transparent 100%);
    font-size: 12.5px; font-weight: 600; color: #fff;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .preset-actions {
    position: absolute; top: 6px; right: 6px; display: flex; gap: 4px;
    opacity: 0; transition: opacity .15s;
  }
  .preset-tile:hover .preset-actions { opacity: 1; }
  .preset-act {
    width: 26px; height: 26px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.16);
    background: rgba(16,16,22,0.82); color: #fff; font-size: 12px;
    display: grid; place-items: center; cursor: pointer; backdrop-filter: blur(6px);
    transition: background .12s, color .12s;
  }
  .preset-act:hover { background: var(--accent); color: #0a140d; border-color: transparent; }
  .preset-act.del:hover { background: var(--danger); color: #fff; }

  .empty { color: var(--muted); padding: 28px; text-align: center; }

  /* Visual Card Selectors (replaces long dropdowns for visual styles) */
  .row.visual-row { flex-direction: column; align-items: stretch; gap: 10px; padding: 14px 15px; }
  .vcard-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(112px, 1fr));
    gap: 8px;
  }
  .vcard {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    padding: 8px 6px 7px; border-radius: 9px;
    background: #14141b; border: 1.5px solid rgba(255,255,255,0.08);
    cursor: pointer; transition: border-color .15s, background .15s, transform .12s;
    text-align: center;
  }
  .vcard:hover { border-color: rgba(255,255,255,0.28); background: #1a1a24; transform: translateY(-1px); }
  .vcard.active { border-color: var(--accent); background: rgba(30,215,96,0.12); box-shadow: 0 0 0 1px rgba(30,215,96,0.28); }
  .vcard-prev {
    width: 100%; height: 42px; border-radius: 6px; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    background: #0d0d13; position: relative; font-size: 13px; font-weight: 700; color: #fff;
  }
  .vcard-lbl { font-size: 11.2px; color: var(--muted); line-height: 1.2; word-break: break-word; }
  .vcard.active .vcard-lbl { color: var(--text); font-weight: 600; }

  /* Layout wireframes */
  .vl-wrap { display: flex; width: 76%; height: 72%; gap: 5px; align-items: center; justify-content: center; }
  .vl-wrap.mir { flex-direction: row-reverse; }
  .vl-wrap.cin { flex-direction: column; gap: 3px; }
  .vl-cov { width: 20px; height: 20px; border-radius: 4px; background: var(--accent); opacity: .85; flex-shrink: 0; }
  .vl-wrap.cin .vl-cov { width: 14px; height: 14px; border-radius: 3px; }
  .vl-lines { display: flex; flex-direction: column; gap: 3px; flex: 1; }
  .vl-wrap.cin .vl-lines { align-items: center; width: 100%; }
  .vl-l { height: 3px; border-radius: 2px; background: rgba(255,255,255,.32); width: 100%; }
  .vl-l.a { background: #fff; width: 85%; }

  /* Plate miniature previews */
  .vp-box { padding: 4px 10px; border-radius: 5px; font-size: 11px; font-weight: 700; color: #fff; }
  .vp-plate { background: rgba(0,0,0,.72); }
  .vp-glass { background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.1); }
  .vp-liquid { background: linear-gradient(160deg, rgba(255,255,255,.22), rgba(255,255,255,.06)); border: 1px solid rgba(255,255,255,.32); box-shadow: inset 0 1px 0 rgba(255,255,255,.45); }
  .vp-bar { background: linear-gradient(90deg, rgba(30,215,96,.28), transparent); box-shadow: inset 3.5px 0 0 #1ed760; border-radius: 2px; }
  .vp-neon { border: 1.5px solid #1ed760; box-shadow: 0 0 8px rgba(30,215,96,.7), inset 0 0 6px rgba(30,215,96,.28); }
  .vp-underline { border-bottom: 2.5px solid #1ed760; border-radius: 0; box-shadow: 0 4px 8px -3px rgba(30,215,96,.7); }
  .vp-gradient { background: linear-gradient(90deg, rgba(30,215,96,.5), rgba(20,150,230,.08)); }
  .vp-halo { background: radial-gradient(ellipse at center, rgba(30,215,96,.55), transparent 75%); box-shadow: 0 0 14px rgba(30,215,96,.4); }
  .vp-brackets { border-radius: 2px; background-image: linear-gradient(#1ed760,#1ed760),linear-gradient(#1ed760,#1ed760),linear-gradient(#1ed760,#1ed760),linear-gradient(#1ed760,#1ed760),linear-gradient(#1ed760,#1ed760),linear-gradient(#1ed760,#1ed760),linear-gradient(#1ed760,#1ed760),linear-gradient(#1ed760,#1ed760); background-repeat: no-repeat; background-size: 7px 2px, 2px 7px; background-position: top left, top left, top right, top right, bottom left, bottom left, bottom right, bottom right; }
  .vp-none { opacity: .5; }

  /* Control style miniatures */
  .vc-bar { display: flex; align-items: center; gap: 5px; color: #f2f3f7; }
  .vc-b { width: 16px; height: 16px; display: grid; place-items: center; font-size: 8px; border-radius: 50%; background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.22); }
  .vc-b.p { width: 20px; height: 20px; font-size: 9px; background: rgba(255,255,255,.24); }
  .vc-minimal .vc-b { background: none; border: none; font-size: 11px; }
  .vc-pill { padding: 3px 7px; border-radius: 99px; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.18); gap: 4px; }
  .vc-pill .vc-b { background: none; border: none; width: 14px; height: 14px; }
  .vc-pill .vc-b.p { background: rgba(255,255,255,.18); width: 17px; height: 17px; }
  .vc-outline .vc-b { background: none; border: 1.5px solid #fff; }
  .vc-squircle .vc-b { border-radius: 4px; }
  .vc-squircle .vc-b.p { width: 24px; border-radius: 5px; }
  .vc-diamond { gap: 8px; }
  .vc-diamond .vc-b { border-radius: 3px; transform: rotate(45deg); width: 14px; height: 14px; }
  .vc-diamond .vc-b.p { width: 17px; height: 17px; }
  .vc-diamond .vc-b span { transform: rotate(-45deg); display: block; }
  .vc-dock { width: 82%; border-radius: 5px; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.18); gap: 0; overflow: hidden; }
  .vc-dock .vc-b { flex: 1; width: auto; height: 20px; border-radius: 0; background: none; border: none; }
  .vc-dock .vc-b.p { border-left: 1px solid rgba(255,255,255,.16); border-right: 1px solid rgba(255,255,255,.16); background: rgba(255,255,255,.08); }
  .vc-underline .vc-b { background: none; border: none; border-radius: 0; border-bottom: 2px solid rgba(255,255,255,.65); height: 18px; }
  .vc-underline .vc-b.p { border-bottom-color: #1ed760; }
  .vc-hex .vc-b { border-radius: 0; border: none; clip-path: polygon(25% 4%,75% 4%,98% 50%,75% 96%,25% 96%,2% 50%); width: 18px; height: 16px; }
  .vc-hex .vc-b.p { width: 21px; height: 19px; }
  .vc-compact .vc-b { border-radius: 3px; width: 14px; height: 14px; }
  .vc-compact .vc-b.p { width: 22px; height: 14px; border-radius: 3px; background: #fff; color: #111; border: none; }

  .sub-card-wrap { margin-bottom: 14px; }
  .sub-card-wrap:last-child { margin-bottom: 0; }
  .sub-heading {
    font-size: 11.5px; text-transform: uppercase; letter-spacing: .07em;
    color: var(--muted); font-weight: 700; margin: 4px 0 7px 2px;
  }

  .toast {
    position: fixed; right: 20px; bottom: 20px; padding: 10px 16px; border-radius: 10px;
    background: var(--accent); color: #09130c; font-weight: 600; opacity: 0;
    transform: translateY(10px); transition: opacity .2s, transform .2s; pointer-events: none; z-index: 20;
  }
  .toast.show { opacity: 1; transform: translateY(0); }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.14); border-radius: 99px; }
  ::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-dot">♪</div>
      <div>
        <div class="brand-title">Spotify Lyrics</div>
        <div class="brand-sub">Standalone Wallpaper</div>
      </div>
    </div>
    <input id="search" class="search" type="search" placeholder="Поиск настройки…">
    <nav id="nav" class="nav"></nav>
    <div class="sidebar-foot">
      <button id="btnImport" class="btn">Импорт</button>
      <button id="btnExport" class="btn">Экспорт</button>
      <button id="btnReset" class="btn danger">Сброс</button>
    </div>
  </aside>
  <main id="main" class="main"></main>
</div>
<div id="toast" class="toast"></div>

  var schemaProps = {};
  var localization = {};
  var groups = [];
  var state = { app: {}, values: {}, monitors: [], audioDevices: [], presets: [] };
  var activeTab = '__presets__';
  var searchQuery = '';
  var draftPresetPath = '';
  var draftPresetPreview = '';
  var draftPresetName = '';

  function currentLang() {
    var pref = (state.app && state.app.uiLanguage) || 'auto';
    if (pref !== 'auto' && UI_I18N[pref]) return pref;
    var nav = ((navigator.languages && navigator.languages[0]) || navigator.language || 'en').toLowerCase().slice(0, 2);
    return UI_I18N[nav] ? nav : 'en';
  }

  function U(key, vars) {
    var lang = currentLang();
    var s = (UI_I18N[lang] && UI_I18N[lang][key]) || UI_I18N.en[key] || key;
    if (vars) {
      for (var k in vars) s = s.replace('{' + k + '}', vars[k]);
    }
    return s;
  }

  function L(key) {
    if (!key) return '';
    var lang = currentLang();
    var locKey = LOCALE_MAP[lang] || 'en-us';
    if (localization[locKey] && localization[locKey][key]) return localization[locKey][key];
    if (localization['en-us'] && localization['en-us'][key]) return localization['en-us'][key];
    if (localization['ru-ru'] && localization['ru-ru'][key]) return localization['ru-ru'][key];
    return key;
  }

  function post(msg) {
    if (window.chrome && window.chrome.webview) {
      window.chrome.webview.postMessage(msg);
    }
  }

  function showToast(text) {
    var t = document.getElementById('toast');
    t.textContent = text;
    t.classList.add('show');
    clearTimeout(t._tm);
    t._tm = setTimeout(function () { t.classList.remove('show'); }, 2200);
  }

  function applyChromeI18n() {
    document.documentElement.lang = currentLang();
    document.title = U('winTitle');
    post({ type: 'setWindowTitle', title: U('winTitle') });
    document.getElementById('search').placeholder = U('searchPh');
    var bi = document.getElementById('btnImport');
    var be = document.getElementById('btnExport');
    var br = document.getElementById('btnReset');
    bi.textContent = U('btnImport'); bi.title = U('btnImportTip');
    be.textContent = U('btnExport'); be.title = U('btnExportTip');
    br.textContent = U('btnReset');  br.title = U('btnResetTip');
  }

  function weColorToHex(str) {
    var parts = String(str || '1 1 1').trim().split(/\s+/).map(Number);
    var r = Math.max(0, Math.min(255, Math.round((parts[0] || 0) * 255)));
    var g = Math.max(0, Math.min(255, Math.round((parts[1] || 0) * 255)));
    var b = Math.max(0, Math.min(255, Math.round((parts[2] || 0) * 255)));
    return '#' + [r, g, b].map(function (v) { return v.toString(16).padStart(2, '0'); }).join('');
  }

  function hexToWeColor(hex) {
    var h = String(hex || '#ffffff').replace('#', '');
    var r = (parseInt(h.slice(0, 2), 16) || 0) / 255;
    var g = (parseInt(h.slice(2, 4), 16) || 0) / 255;
    var b = (parseInt(h.slice(4, 6), 16) || 0) / 255;
    return r.toFixed(4) + ' ' + g.toFixed(4) + ' ' + b.toFixed(4);
  }

  function evalCondition(cond) {
    if (!cond) return true;
    try {
      var names = [];
      var vals = [];
      for (var k in schemaProps) {
        if (schemaProps[k].type === 'group') continue;
        names.push(k);
        var v = state.values[k];
        if (v === undefined) v = schemaProps[k].value;
        vals.push({ value: v });
      }
      var fn = new Function(names.join(','), 'return !!(' + cond + ');');
      return !!fn.apply(null, vals);
    } catch (e) {
      return true;
    }
  }

  function buildGroupsFromSchema(props) {
    schemaProps = props || {};
    var entries = Object.keys(schemaProps)
      .filter(function (k) { return k !== 'schemecolor'; })
      .map(function (k) { return { key: k, def: schemaProps[k] }; });
    entries.sort(function (a, b) {

        current = { id: entry.key, titleKey: entry.def.text || entry.key, items: [] };

      var min = def.min !== undefined ? def.min : 0;
      var max = def.max !== undefined ? def.max : 100;
      var step = def.step !== undefined ? def.step : (def.fraction ? 0.05 : 1);

      var rng = document.createElement('input');
      rng.type = 'range';
      rng.min = min; rng.max = max; rng.step = step;
      rng.value = Number(val ?? min);

      var num = document.createElement('input');
      num.type = 'number';

  function renderMain() {
    var main = document.getElementById('main');
    main.innerHTML = '';

    if (searchQuery) {
      var q = searchQuery.toLowerCase();
      var h = document.createElement('div');
      h.className = 'section-title';
      h.textContent = U('searchTitle', { q: searchQuery });
      main.appendChild(h);

      var found = 0;
      groups.forEach(function (g) {
        var matches = g.items.filter(function (it) {
          var label = L(it.def.text || '').toLowerCase();
          return label.includes(q) || it.key.toLowerCase().includes(q);
        });
        if (!matches.length) return;
        found += matches.length;

        var gh = document.createElement('div');
        gh.className = 'group-heading';
        gh.textContent = groupTitle(g);
        main.appendChild(gh);

        var card = document.createElement('div');
        card.className = 'card';
        matches.forEach(function (m) {
          var row = createPropertyRow(m);
          row.style.display = '';
          card.appendChild(row);
        });
        main.appendChild(card);
      });

      if (!found) {
        var emp = document.createElement('div');
        emp.className = 'empty';
        emp.textContent = U('nothingFound');
        main.appendChild(emp);
      }
      return;
    }

    if (activeTab === '__presets__') {
      renderPresetsTab(main);
      return;
    }

    if (activeTab === '__app__') {
      renderAppTab(main);
      return;
    }

    var grp = groups.find(function (g) { return g.id === activeTab; });
    if (!grp) return;

    var head = document.createElement('div');
    head.className = 'section-head';
    var title = document.createElement('div');
    title.className = 'section-title';
    title.textContent = groupNavLabel(grp);
    head.appendChild(title);

    var resetSecBtn = document.createElement('button');
    resetSecBtn.className = 'btn inline';
    resetSecBtn.textContent = U('resetSection');
    resetSecBtn.onclick = function () {
      if (confirm(U('confirmResetSection', { name: groupTitle(grp) }))) {
        post({ type: 'resetSection', keys: grp.items.map(function (it) { return it.key; }) });
      }
    };
    head.appendChild(resetSecBtn);
    main.appendChild(head);

    var SUB_DEFS = {
      bggroup: [
        { title: 'subBgType', keys: ['bgmode'] },
        { title: 'subBgOpts', rest: true }
      ],
      textgroup: [
        { title: 'subLayoutFont', keys: ['layoutmode', 'offset', 'fontsize', 'dimamount'] },
        { title: 'subAnim', keys: ['lyricmode', 'typefill', 'typecursor', 'lyriclift', 'lyricblur'] },
        { title: 'subColors', rest: true }
      ],
      strokegroup: [
        { title: 'subOutline', keys: ['textshadow', 'activeshadow', 'strokecmode', 'strokecolor', 'activestrokecmode', 'activestrokecolor'] },
        { title: 'subPlate', rest: true }
      ],
      infogroup: [
        { title: 'subInfoStyle', keys: ['infotextcmode', 'infotextcolor', 'infoshadow', 'infostrokecmode', 'infostrokecolor'] },
        { title: 'subInfoPlate', keys: ['infoplate', 'infoplateamount', 'infoplatecmode', 'infoplatecolor', 'infobarcmode', 'infobarcolor'] },
        { title: 'subPosition', rest: true }
      ],
      clockgroup: [
        { title: 'subClockDisp', keys: ['clockshow', 'clockformat', 'clockseconds', 'clockweekday', 'clockdate'] },
        { title: 'subClockLook', keys: ['clocksize', 'clockcmode', 'clockcolor', 'clockshadow', 'clockstrokecmode', 'clockstrokecolor'] },
        { title: 'subPosition', rest: true }
      ],
      ctrlgroup: [
        { title: 'subCtrlStyle', keys: ['mediacontrols', 'ctrlstyle'] },
        { title: 'subCtrlExtra', rest: true }
      ]
    };

    var subDefs = SUB_DEFS[grp.id];
    if (subDefs) {
      var used = {};
      subDefs.forEach(function (sd) {
        var items = sd.rest
          ? grp.items.filter(function (it) { return !used[it.key]; })
          : grp.items.filter(function (it) { return sd.keys.indexOf(it.key) >= 0; });
        items.forEach(function (it) { used[it.key] = 1; });
        if (!items.length) return;

        var wrap = document.createElement('div');
        wrap.className = 'sub-card-wrap';
        var sh = document.createElement('div');
        sh.className = 'sub-heading';
        sh.textContent = U(sd.title);

        var card = document.createElement('div');
        card.className = 'card';
        items.forEach(function (it) { card.appendChild(createPropertyRow(it)); });
        wrap.appendChild(card);
        main.appendChild(wrap);
      });
      updateConditions();
    } else {
      var card = document.createElement('div');
      card.className = 'card';
      grp.items.forEach(function (it) {
        card.appendChild(createPropertyRow(it));
      });

    if (confirm(U('confirmReset'))) {
      post({ type: 'resetDefaults' });
      showToast(U('toastReset'));
    }
  };
  document.getElementById('btnExport').onclick = function () { post({ type: 'exportPreset' }); };
  document.getElementById('btnImport').onclick = function () { post({ type: 'importPreset' }); };

  if (window.chrome && window.chrome.webview) {
    window.chrome.webview.addEventListener('message', function (ev) {
      var msg = ev.data;
      if (!msg) return;
      if (msg.type === 'init') {
        state = msg.state || state;
        applyChromeI18n();
        renderNav();
        renderMain();
      } else if (msg.type === 'filePicked') {
        state.values[msg.key] = msg.path;
        var el = document.getElementById('file-' + msg.key);
        if (el) {
          el.textContent = String(msg.path).split(/[\\/]/).pop();
          el.title = msg.path;
        }
      } else if (msg.type === 'presetImagePicked') {
        draftPresetPath = msg.path || '';
        draftPresetPreview = msg.preview || '';
        if (activeTab === '__presets__') renderMain();
      } else if (msg.type === 'toast') {
        showToast(msg.text);
      } else if (msg.type === 'toastKey') {
        showToast(U(msg.key));
      }
    });
  }

  fetch('/project.json')
    .then(function (r) { return r.json(); })
    .then(function (proj) {
      localization = (proj && proj.general && proj.general.localization) || {};
      buildGroupsFromSchema(proj && proj.general && proj.general.properties);
      applyChromeI18n();
      post({ type: 'ready' });
    })
    .catch(function () {
      applyChromeI18n();
      post({ type: 'ready' });
    });
})();
</script>
</body>
</html>
