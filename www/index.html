<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Spotify Synced Lyrics</title>
<style>
  /* тени/обводки и цвета подсветки строятся в JS (applyStyle) из настроек */
  :root {
    --fg-rgb: 255,255,255; --plate-rgb: 0,0,0; --bar-rgb: 255,255,255; --plate-a: .35;
    --iplate-rgb: 0,0,0; --ibar-rgb: 255,255,255; --iplate-a: .4; --shrink: 58%;
    --info-x: 0vw; --info-y: 0vh; --clock-x: 0vw; --clock-y: 0vh;
    --tshadow: 0 0 2px rgba(0,0,0,.35), 0 2px 12px rgba(0,0,0,.35), 0 6px 32px rgba(0,0,0,.28);
  }
  :root { --fg: #fff; --shadow: rgba(0,0,0,.35); --fontsize: 44px; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    background: #222;
    color: var(--fg);
    font-family: "Segoe UI", "Inter", Arial, sans-serif;
    text-shadow: var(--tshadow);
    -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision;
    transition: background-color 1s ease, color 1s ease;
  }
  #eq { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; display: none; pointer-events: none; }
  #bgimg { position: fixed; left: -80px; top: -80px; width: calc(100% + 160px); height: calc(100% + 160px); z-index: 0; display: none; background-repeat: no-repeat; background-position: center; background-size: cover; }
  #stars { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; display: none; }
  #waves { position: fixed; left: -80px; top: -80px; width: calc(100% + 160px); height: calc(100% + 160px); z-index: 0; display: none; }
  #waves2 { position: fixed; left: -80px; top: -80px; width: calc(100% + 160px); height: calc(100% + 160px); z-index: 0; display: none; }
  #waves3 { position: fixed; left: -80px; top: -80px; width: calc(100% + 160px); height: calc(100% + 160px); z-index: 0; display: none; }
  #blurbg { position: fixed; left: -80px; top: -80px; width: calc(100% + 160px); height: calc(100% + 160px); z-index: 0; display: none; background: center / cover no-repeat;
            transition: opacity .35s ease; animation: breathe 16s ease-in-out infinite alternate; }
  @keyframes breathe { from { transform: scale(var(--bzoom, 1.2)); } to { transform: scale(calc(var(--bzoom, 1.2) + var(--bamp, .12))) rotate(2deg); } }
  #mesh { position: fixed; left: -80px; top: -80px; width: calc(100% + 160px); height: calc(100% + 160px); z-index: 0; display: none; }
  #snow { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; display: none; }
  #fuse { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 2; display: none; pointer-events: none; }
  /* виниловая пластинка поверх обложки: обложка становится этикеткой, пластинка вращается, пока играет музыка */
  #vdisc { position: fixed; z-index: 1; display: none; pointer-events: none; border-radius: 50%; box-shadow: 0 2vh 6vh rgba(0,0,0,.5); }
  #vdisc > div, .vd-rot > div { position: absolute; inset: 0; border-radius: 50%; }
  .vd-rot { animation: vspin var(--vspin, 4s) linear infinite; animation-play-state: var(--vplay, paused); }
  @keyframes vspin { to { transform: rotate(360deg); } }
  .vd-disc { background: radial-gradient(circle closest-side, #000 0 4%, transparent 4.5%), repeating-radial-gradient(circle closest-side, #0c0c0c 0 1.2%, #1d1d1d 1.2% 2%); }
  #vdisc .vd-label { inset: 31%; background: #444 center / cover no-repeat; box-shadow: 0 0 0 .3vw #111; }
  .vd-label::after { content: ''; position: absolute; left: 50%; top: 50%; width: 9%; height: 9%; margin: -4.5% 0 0 -4.5%; border-radius: 50%; background: #111; }
  .vd-gloss { background: conic-gradient(from 20deg, transparent 0 8%, rgba(255,255,255,.2) 12%, transparent 18% 50%, rgba(255,255,255,.13) 62%, transparent 70%); }
  /* прогресс-бар трека: под названием и альбомом, двигается ползунками */
  #prog { position: relative; margin-top: .2vh; width: var(--prog-w, 100%); display: none; color: var(--info-fg, var(--fg));
          transform: translate(var(--prog-x, 0vw), var(--prog-y, 0vh)); }
  /* кнопки управления треком прямо на обоях (4 минималистичных стиля) */
  #mctrl {
    position: relative; left: var(--ctrl-x, 0vw); top: var(--ctrl-y, 0vh);
    display: flex; align-items: center; gap: .7vw; margin-top: -.4vh;
    width: fit-content;
    color: var(--ctrl-fg, var(--fg)); text-shadow: none;
    transition: opacity .3s ease;
  }
  #mctrl.hidden { display: none; }
  .mbtn {
    width: 2.55vw; height: 2.55vw; min-width: 34px; min-height: 34px;
    border-radius: 50%; border: 1px solid rgba(var(--fg-rgb), .2);
    background: rgba(var(--iplate-rgb, 0,0,0), .28);
    -webkit-backdrop-filter: blur(12px) saturate(1.2); backdrop-filter: blur(12px) saturate(1.2);
    color: inherit; display: grid; place-items: center; cursor: pointer;
    padding: 0; outline: none;
    box-shadow: 0 4px 14px rgba(0,0,0,.22);
    transition: transform .15s ease, background-color .18s ease, border-color .18s ease, opacity .18s ease;
  }
  .mbtn.play { width: 2.95vw; height: 2.95vw; min-width: 40px; min-height: 40px; background: rgba(var(--iplate-rgb, 0,0,0), .42); }
  .mbtn:hover { background: rgba(var(--fg-rgb), .18); border-color: rgba(var(--fg-rgb), .42); transform: scale(1.06); }
  .mbtn:active, .mbtn.pulse { transform: scale(.91); background: rgba(var(--fg-rgb), .28); }
  .mbtn svg { width: 46%; height: 46%; fill: currentColor; pointer-events: none; }

  /* стиль «Чистые иконки»: ультра-минимализм без кругов и рамок */
  #mctrl.cs-minimal { gap: 1.05vw; }
  #mctrl.cs-minimal .mbtn {
    width: 2.15vw; height: 2.15vw; min-width: 28px; min-height: 28px;
    background: transparent; border: none; box-shadow: none;
    -webkit-backdrop-filter: none; backdrop-filter: none; opacity: .78;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,.4));
  }
  #mctrl.cs-minimal .mbtn.play { width: 2.55vw; height: 2.55vw; min-width: 34px; min-height: 34px; opacity: 1; }
  #mctrl.cs-minimal .mbtn svg { width: 72%; height: 72%; }
  #mctrl.cs-minimal .mbtn:hover { background: transparent; opacity: 1; transform: scale(1.14); }
  #mctrl.cs-minimal .mbtn:active, #mctrl.cs-minimal .mbtn.pulse { background: transparent; transform: scale(.88); }

  /* стиль «Капсула»: единая стеклянная таблетка */
  #mctrl.cs-pill {
    gap: .35vw; padding: .3vw .55vw; border-radius: 999px;
    background: rgba(var(--iplate-rgb, 0,0,0), .34);
    border: 1px solid rgba(var(--fg-rgb), .16);
    -webkit-backdrop-filter: blur(14px) saturate(1.25); backdrop-filter: blur(14px) saturate(1.25);
    box-shadow: 0 6px 20px rgba(0,0,0,.28);
  }
  #mctrl.cs-pill .mbtn {
    width: 2.3vw; height: 2.3vw; min-width: 30px; min-height: 30px;
    background: transparent; border: none; box-shadow: none;
    -webkit-backdrop-filter: none; backdrop-filter: none;
  }
  #mctrl.cs-pill .mbtn.play { width: 2.55vw; height: 2.55vw; min-width: 34px; min-height: 34px; background: rgba(var(--fg-rgb), .14); }
  #mctrl.cs-pill .mbtn:hover { background: rgba(var(--fg-rgb), .2); transform: scale(1.05); }

  /* стиль «Тонкие кольца»: прозрачные контуры */
  #mctrl.cs-outline .mbtn {
    background: transparent; border: 1.5px solid currentColor; box-shadow: none;
    -webkit-backdrop-filter: none; backdrop-filter: none; opacity: .82;
  }
  #mctrl.cs-outline .mbtn.play { background: transparent; border-width: 2px; opacity: 1; }
  #mctrl.cs-outline .mbtn:hover { background: rgba(var(--fg-rgb), .14); opacity: 1; transform: scale(1.07); }

  /* стиль «Скруглённые квадраты (iOS)»: мягкие сквирклы */
  #mctrl.cs-squircle { gap: .6vw; }
  #mctrl.cs-squircle .mbtn { border-radius: 28%; }
  #mctrl.cs-squircle .mbtn.play { width: 3.6vw; min-width: 48px; border-radius: 26%; }

  /* стиль «Ромбы»: геометрические повёрнутые квадраты */
  #mctrl.cs-diamond { gap: 1.15vw; padding: .35vw .25vw; }
  #mctrl.cs-diamond .mbtn {
    width: 2.25vw; height: 2.25vw; min-width: 30px; min-height: 30px;
    border-radius: 18%; transform: rotate(45deg);
  }
  #mctrl.cs-diamond .mbtn.play { width: 2.65vw; height: 2.65vw; min-width: 36px; min-height: 36px; }
  #mctrl.cs-diamond .mbtn svg { transform: rotate(-45deg); }
  #mctrl.cs-diamond .mbtn:hover { transform: rotate(45deg) scale(1.1); }
  #mctrl.cs-diamond .mbtn:active, #mctrl.cs-diamond .mbtn.pulse { transform: rotate(45deg) scale(.9); }

  /* стиль «Единая панель (док)»: полоса во всю ширину обложки с разделителями */
  #mctrl.cs-dock {
    width: 100%; gap: 0; border-radius: .75vw; overflow: hidden;
    background: rgba(var(--iplate-rgb, 0,0,0), .34);
    border: 1px solid rgba(var(--fg-rgb), .16);
    -webkit-backdrop-filter: blur(14px) saturate(1.25); backdrop-filter: blur(14px) saturate(1.25);
    box-shadow: 0 6px 20px rgba(0,0,0,.26);
  }
  #mctrl.cs-dock .mbtn {
    flex: 1; width: auto; height: 2.65vw; min-height: 36px;
    border-radius: 0; border: none; background: transparent; box-shadow: none;
    -webkit-backdrop-filter: none; backdrop-filter: none;
  }
  #mctrl.cs-dock .mbtn.play {
    flex: 1.35; width: auto; height: 2.65vw; min-height: 36px;
    border-left: 1px solid rgba(var(--fg-rgb), .12);
    border-right: 1px solid rgba(var(--fg-rgb), .12);
    background: rgba(var(--fg-rgb), .07);
  }
  #mctrl.cs-dock .mbtn svg { width: 1.15vw; height: 1.15vw; min-width: 16px; min-height: 16px; }
  #mctrl.cs-dock .mbtn:hover { background: rgba(var(--fg-rgb), .16); transform: none; }
  #mctrl.cs-dock .mbtn:active, #mctrl.cs-dock .mbtn.pulse { background: rgba(var(--fg-rgb), .26); transform: none; }

  /* стиль «Нижние полоски»: чистые иконки с акцентной линией снизу */
  #mctrl.cs-underline { gap: 1.1vw; }
  #mctrl.cs-underline .mbtn {
    position: relative; width: 2.35vw; height: 2.35vw; min-width: 30px; min-height: 30px;
    border-radius: 0; border: none; background: transparent; box-shadow: none;
    -webkit-backdrop-filter: none; backdrop-filter: none; opacity: .82;
  }
  #mctrl.cs-underline .mbtn::after {
    content: ''; position: absolute; left: 22%; right: 22%; bottom: 0; height: 2px; border-radius: 2px;
    background: currentColor; opacity: .45; transition: left .16s ease, right .16s ease, opacity .16s ease;
  }
  #mctrl.cs-underline .mbtn.play { width: 2.75vw; height: 2.5vw; min-width: 36px; opacity: 1; }
  #mctrl.cs-underline .mbtn.play::after { left: 10%; right: 10%; height: 2.5px; opacity: .95; }
  #mctrl.cs-underline .mbtn svg { width: 62%; height: 62%; }
  #mctrl.cs-underline .mbtn:hover { background: transparent; opacity: 1; transform: translateY(-2px); }
  #mctrl.cs-underline .mbtn:hover::after { left: 6%; right: 6%; opacity: 1; }
  #mctrl.cs-underline .mbtn:active, #mctrl.cs-underline .mbtn.pulse { background: transparent; transform: translateY(1px); }

  /* стиль «Шестиугольники»: соты */
  #mctrl.cs-hex { gap: .6vw; }
  #mctrl.cs-hex .mbtn {
    width: 2.75vw; height: 2.5vw; min-width: 36px; min-height: 32px;
    border-radius: 0; border: none;
    clip-path: polygon(25% 4%, 75% 4%, 98% 50%, 75% 96%, 25% 96%, 2% 50%);
  }
  #mctrl.cs-hex .mbtn.play { width: 3.15vw; height: 2.85vw; min-width: 42px; min-height: 38px; }

  /* стиль «Компактный мини-бар»: строгий минимал-акцент */
  #mctrl.cs-compact { gap: .45vw; }
  #mctrl.cs-compact .mbtn {
    width: 2.05vw; height: 2.05vw; min-width: 26px; min-height: 26px;
    border-radius: 6px; background: rgba(var(--iplate-rgb, 0,0,0), .22);
    border: 1px solid rgba(var(--fg-rgb), .12); box-shadow: none;
  }
  #mctrl.cs-compact .mbtn.play {
    width: 3.2vw; height: 2.05vw; min-width: 42px; min-height: 26px;
    border-radius: 6px; background: currentColor; border-color: transparent;
  }
  #mctrl.cs-compact .mbtn.play svg { fill: rgb(var(--iplate-rgb, 12,12,16)); width: 42%; height: 62%; }

  #pbar { position: relative; height: .35vh; border-radius: 1vh; background: rgba(var(--prog-rgb, 255,255,255), .28); overflow: hidden; cursor: pointer; transition: height .15s ease; }
  #pbar:hover { height: .65vh; }
  #pfill { height: 100%; width: 0; border-radius: inherit; background: rgb(var(--prog-rgb, 255,255,255)); pointer-events: none; }
  #prog.ps-thick #pbar { height: .9vh; }
  #prog.ps-seg #pbar { height: .9vh; border-radius: 0; -webkit-mask-image: repeating-linear-gradient(90deg, #000 0 .45vw, transparent .45vw .6vw); mask-image: repeating-linear-gradient(90deg, #000 0 .45vw, transparent .45vw .6vw); }
  #prog.ps-seg #pfill { border-radius: 0; }
  #prog.ps-fuse #pbar { display: none; }
  #ptime { display: flex; justify-content: space-between; margin-top: .6vh; font-size: 1.1vw; opacity: .8; font-variant-numeric: tabular-nums; }
  #prog.ps-fuse #ptime { display: none; }
  #prog.notime #ptime { display: none; }
  #blobs { position: fixed; left: -80px; top: -80px; width: calc(100% + 160px); height: calc(100% + 160px); z-index: 0; display: none; }
  #grain { position: fixed; inset: 0; z-index: 0; display: none; pointer-events: none; opacity: .5; }
  #app { position: relative; z-index: 1; display: flex; width: 100%; height: 100%; align-items: center; padding: 0 6vw; gap: 5vw; }

  #left { position: relative; flex: 0 0 30vw; display: flex; flex-direction: column; gap: 2vh; transition: transform .9s cubic-bezier(.65, 0, .25, 1); }
  #app.centered #left { transform: translateX(29vw); }          /* центр блока слева (21vw) -> центр экрана (50vw) */
  /* текст песен: уходит вправо с размытием, приходит справа чуть позже обложки */
  #lyrics { transition: opacity .45s ease, transform .6s cubic-bezier(.2, .8, .2, 1), filter .45s ease; }
  #app:not(.centered) #lyrics { transition-delay: .25s; }
  #app.centered #lyrics { opacity: 0; transform: translateX(6vw); filter: blur(8px); pointer-events: none; }
  /* местное время над обложкой: едет вместе с блоком трека и плавно увеличивается в центре */
  #clock { position: relative; left: var(--clock-x); top: var(--clock-y); transform-origin: left bottom; transform: scale(1); transition: transform .9s cubic-bezier(.65, 0, .25, 1); }
  #app.centered #clock { transform: scale(1.6); }
  #ctime { font-size: calc(3.2vw * var(--clocksize, 1)); font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
  #ctime .ampm { font-size: .4em; font-weight: 600; margin-left: .3em; opacity: .7; }
  #cdate { font-size: calc(1.3vw * var(--clocksize, 1)); opacity: .65; margin-top: .3vh; }
  #cover {
    width: 100%; aspect-ratio: 1 / 1; object-fit: cover; border-radius: var(--cover-r, 4%);
    box-shadow: 0 2vh 6vh rgba(0,0,0,.45); background: rgba(128,128,128,.25);
    transition: opacity .5s ease, width .9s cubic-bezier(.65, 0, .25, 1), margin-bottom .9s cubic-bezier(.65, 0, .25, 1), box-shadow .9s ease;
  }
  /* HD-обложки нет: остаётся только миниатюра — плавно уменьшаем; нет вообще никакой — обложка складывается, название поднимается на её место */
  #left.cover-small #cover { width: var(--shrink, 58%); }
  #left.cover-none #cover { width: 0; margin-bottom: -2vh; opacity: 0 !important; box-shadow: none; }
  /* ничего не играет: без пустого прямоугольника обложки / без надписи */
  #left.idle-nocover #cover { width: 0; margin-bottom: -2vh; opacity: 0 !important; box-shadow: none; }
  #left.idle-notext #info { display: none; }
  #title  { font-size: 2.2vw; font-weight: 700; line-height: 1.2; }
  #artist { font-size: 1.5vw; opacity: .75; }
  #album  { font-size: 1.2vw; opacity: .55; margin-top: .6vh; display: none; }
  /* блок «название / исполнитель / альбом»: своя обводка и необязательная подложка (мыльный прямоугольник) */
  #info { position: relative; left: var(--info-x); top: var(--info-y); width: fit-content; max-width: 100%; padding: .7vw 1vw; margin: -.7vw 0 -.7vw -1vw; border-radius: .9vw;
          text-shadow: var(--ishadow, var(--tshadow)); transition: background-color .4s ease; }
  #info.ip-plate { background-color: rgba(var(--iplate-rgb), var(--iplate-a)); }
  #info.ip-glass { background-color: rgba(var(--iplate-rgb), calc(var(--iplate-a) * .6)); -webkit-backdrop-filter: blur(14px) saturate(1.3); backdrop-filter: blur(14px) saturate(1.3); }
  #info.ip-liquid { background: linear-gradient(160deg, rgba(255,255,255,.14), rgba(var(--iplate-rgb), calc(var(--iplate-a) * .55))); -webkit-backdrop-filter: blur(18px) saturate(1.45); backdrop-filter: blur(18px) saturate(1.45); border: 1px solid rgba(255,255,255,.22); box-shadow: inset 0 1px 0 rgba(255,255,255,.32), 0 8px 26px rgba(0,0,0,.28); }
  #info.ip-neon { background-color: rgba(var(--iplate-rgb), calc(var(--iplate-a) * .35)); border: 1.5px solid rgba(var(--ibar-rgb), .9); box-shadow: 0 0 14px rgba(var(--ibar-rgb), .42), inset 0 0 12px rgba(var(--ibar-rgb), .2); }
  #info.ip-underline { background: transparent; border-radius: 0; border-bottom: 2.5px solid rgb(var(--ibar-rgb)); box-shadow: 0 4px 14px -4px rgba(var(--ibar-rgb), .55); }
  #info.ip-gradient { background-image: linear-gradient(90deg, rgba(var(--iplate-rgb), var(--iplate-a)), rgba(var(--iplate-rgb), 0)); }
  #info.ip-halo { background: radial-gradient(ellipse at center, rgba(var(--iplate-rgb), var(--iplate-a)) 0%, rgba(var(--iplate-rgb), 0) 74%); box-shadow: 0 0 28px rgba(var(--iplate-rgb), calc(var(--iplate-a) * .65)); }
  #info.ip-brackets { background-color: rgba(var(--iplate-rgb), calc(var(--iplate-a) * .28)); border-radius: .2em; background-image: linear-gradient(rgb(var(--ibar-rgb)), rgb(var(--ibar-rgb))), linear-gradient(rgb(var(--ibar-rgb)), rgb(var(--ibar-rgb))), linear-gradient(rgb(var(--ibar-rgb)), rgb(var(--ibar-rgb))), linear-gradient(rgb(var(--ibar-rgb)), rgb(var(--ibar-rgb))), linear-gradient(rgb(var(--ibar-rgb)), rgb(var(--ibar-rgb))), linear-gradient(rgb(var(--ibar-rgb)), rgb(var(--ibar-rgb))), linear-gradient(rgb(var(--ibar-rgb)), rgb(var(--ibar-rgb))), linear-gradient(rgb(var(--ibar-rgb)), rgb(var(--ibar-rgb))); background-repeat: no-repeat; background-size: 14px 2.5px, 2.5px 14px, 14px 2.5px, 2.5px 14px, 14px 2.5px, 2.5px 14px, 14px 2.5px, 2.5px 14px; background-position: top left, top left, top right, top right, bottom left, bottom left, bottom right, bottom right; }
  #lyrics { color: var(--lyric-fg, var(--fg)); }
  #info { color: var(--info-fg, var(--fg)); }
  #clock { color: var(--clock-fg, var(--fg)); text-shadow: var(--cshadow, var(--tshadow)); }
  #info.ip-bar   { background-image: linear-gradient(90deg, rgba(var(--iplate-rgb), var(--iplate-a)), rgba(var(--iplate-rgb), 0)); box-shadow: inset .35vw 0 0 rgb(var(--ibar-rgb)); border-radius: .15em; }

  #lyrics {
    position: relative; flex: 1; height: 100vh; overflow: hidden;
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 22%, #000 78%, transparent 100%);
            mask-image: linear-gradient(to bottom, transparent 0, #000 22%, #000 78%, transparent 100%);
  }
  #lyrics { margin-left: -70px; }
  #track { position: absolute; left: 0; right: 0; top: 0; padding: 0 70px; transition: transform .6s cubic-bezier(.2,.8,.2,1); }
  .line {
    font-size: var(--fontsize); font-weight: 800; line-height: 1.25;
    padding: .35em .45em; margin-left: -.45em; width: fit-content; max-width: calc(100% + .45em); border-radius: .3em;
    opacity: .3; transform-origin: left center;
    transform: scale(.88); transition: opacity .4s ease, transform .4s ease, background-color .4s ease;
  }
  .line.active { opacity: 1; transform: scale(1); color: var(--active-lyric-fg, var(--lyric-fg, var(--fg))); text-shadow: var(--ashadow, var(--tshadow)); }
  /* плашка / подсветка текущей строки */
  :root.ap-plate .line.active { background-color: rgba(var(--plate-rgb), var(--plate-a)); }
  :root.ap-glass .line.active { background-color: rgba(var(--plate-rgb), calc(var(--plate-a) * .6)); -webkit-backdrop-filter: blur(14px) saturate(1.3); backdrop-filter: blur(14px) saturate(1.3); }
  :root.ap-liquid .line.active { background: linear-gradient(160deg, rgba(255,255,255,.15), rgba(var(--plate-rgb), calc(var(--plate-a) * .55))); -webkit-backdrop-filter: blur(18px) saturate(1.45); backdrop-filter: blur(18px) saturate(1.45); border: 1px solid rgba(255,255,255,.24); box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 10px 30px rgba(0,0,0,.3); }

  function resize() {
    var c = $('waves');
    c.width  = Math.max(2, Math.floor((innerWidth + 160) * 0.75));   // 75% разрешения: тонкие линии остаются чёткими
    c.height = Math.max(2, Math.floor((innerHeight + 160) * 0.75));

  function upload(i, bytes) {

  // Палитра в виде полоски 256x1: ширина цвета = его доля на обложке, границы мягкие и зациклены
  function rgb2oklab(r, g, b) {
    function lin(v) { v /= 255; return v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }
    var lr = lin(r), lg = lin(g), lb = lin(b);
    var l = Math.cbrt(0.4122214708 * lr + 0.5363325363 * lg + 0.0514459929 * lb);
    var m = Math.cbrt(0.2119034982 * lr + 0.6806995451 * lg + 0.1073969566 * lb);
    var s = Math.cbrt(0.0883024619 * lr + 0.2817188376 * lg + 0.6299787005 * lb);
    return [
      0.2104542553 * l + 0.7936177850 * m - 0.0040720468 * s,
      1.9779984951 * l - 2.4285922050 * m + 0.4505937099 * s,
      0.0259040371 * l + 0.7827717662 * m - 0.8086757660 * s
    ];
  }
  function oklab2rgb(L, a, b) {
    var l = L + 0.3963377774 * a + 0.2158037573 * b;
    var m = L - 0.1055613458 * a - 0.0638541728 * b;
    var s = L - 0.0894841775 * a - 1.2914855480 * b;
    l = l * l * l; m = m * m * m; s = s * s * s;
    function srgb(x) {
      x = Math.min(1, Math.max(0, x));
      return Math.round((x <= 0.0031308 ? 12.92 * x : 1.055 * Math.pow(x, 1 / 2.4) - 0.055) * 255);
    }
    return [
      srgb(+4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s),
      srgb(-1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s),
      srgb(-0.0041960863 * l - 0.7034186147 * m + 1.7076147010 * s)
    ];
  }

  // Улучшенная палитра специально для «Волны 1» и «Волны 2»: K-Means в OKLab + отсечение рамок + замкнутое кольцо цветов
  function extractWavePalette(d, S) {
    var pts = [], totalW = 0, margin = Math.floor(S * 0.07);
    for (var y = 0; y < S; y += 2) {
      var borderY = (y < margin || y >= S - margin);
      for (var x = 0; x < S; x += 2) {
        var idx = (y * S + x) * 4;
        var w = (borderY || x < margin || x >= S - margin) ? 0.35 : 1.0;
        var lab = rgb2oklab(d[idx], d[idx + 1], d[idx + 2]);
        pts.push([lab[0], lab[1], lab[2], w]);
        totalW += w;
      }
    }
    if (!pts.length) return state.palette;

    // K-Means++ инициализация (детерминированная — выбираем самые удалённые в OKLab, с бонусом за насыщенность)
    var K = 7, centers = [];
    // 1-й центр: самый весомый/типичный пиксель из сетки
    centers.push([pts[Math.floor(pts.length * 0.5)][0], pts[Math.floor(pts.length * 0.5)][1], pts[Math.floor(pts.length * 0.5)][2]]);
    var minD = new Float32Array(pts.length);
    for (var i = 0; i < pts.length; i++) minD[i] = 1e9;

    for (var k = 1; k < K; k++) {
      var last = centers[k - 1], bestIdx = 0, bestScore = -1;
      for (var i = 0; i < pts.length; i++) {
        var p = pts[i], dL = p[0] - last[0], da = p[1] - last[1], db = p[2] - last[2];
        var dist = dL * dL + da * da + db * db;
        if (dist < minD[i]) minD[i] = dist;
        var chroma = Math.sqrt(p[1] * p[1] + p[2] * p[2]);
        var score = minD[i] * p[3] * (1.0 + chroma * 3.5);
        if (score > bestScore) { bestScore = score; bestIdx = i; }
      }
      centers.push([pts[bestIdx][0], pts[bestIdx][1], pts[bestIdx][2]]);
    }

    // 7 итераций K-Means в OKLab
    var sumL = new Float64Array(K), sumA = new Float64Array(K), sumB = new Float64Array(K), sumW = new Float64Array(K);
    for (var it = 0; it < 7; it++) {
      sumL.fill(0); sumA.fill(0); sumB.fill(0); sumW.fill(0);
      for (var i = 0; i < pts.length; i++) {
        var p = pts[i], bi = 0, bd = 1e9;
        for (var c = 0; c < K; c++) {
          var cc = centers[c], dL = p[0] - cc[0], da = p[1] - cc[1], db = p[2] - cc[2];
          var dd = dL * dL + da * da + db * db;
          if (dd < bd) { bd = dd; bi = c; }
        }
        var pw = p[3];
        sumL[bi] += p[0] * pw; sumA[bi] += p[1] * pw; sumB[bi] += p[2] * pw; sumW[bi] += pw;
      }
      for (var c = 0; c < K; c++) {
        if (sumW[c] > 0) {
          centers[c][0] = sumL[c] / sumW[c];
          centers[c][1] = sumA[c] / sumW[c];
          centers[c][2] = sumB[c] / sumW[c];
        }
      }
    }

    // Собираем кластеры, отфильтровываем микро-шум и сливаем слишком близкие в OKLab
    var raw = [];
    for (var c = 0; c < K; c++) {
      var share = sumW[c] / totalW;
      var ch = Math.sqrt(centers[c][1] * centers[c][1] + centers[c][2] * centers[c][2]);
      if (share < 0.008 && !(ch > 0.08 && share >= 0.0035)) continue;
      raw.push({ L: centers[c][0], a: centers[c][1], b: centers[c][2], ch: ch, share: share });
    }
    raw.sort(function (x, y) { return y.share - x.share; });
    var merged = [];
    raw.forEach(function (it) {
      var best = -1, bd = 1e9;
      merged.forEach(function (m, idx) {
        var dL = m.L - it.L, da = m.a - it.a, db = m.b - it.b, dd = Math.sqrt(dL * dL + da * da + db * db);
        if (dd < bd) { bd = dd; best = idx; }
      });
      if (best >= 0 && bd < 0.075) {
        var m = merged[best], tw = m.share + it.share;
        m.L = (m.L * m.share + it.L * it.share) / tw;
        m.a = (m.a * m.share + it.a * it.share) / tw;
        m.b = (m.b * m.share + it.b * it.share) / tw;
        m.ch = Math.sqrt(m.a * m.a + m.b * m.b);
        m.share = tw;
      } else {
        merged.push({ L: it.L, a: it.a, b: it.b, ch: it.ch, share: it.share });
      }
    });
    if (!merged.length) return state.palette;

    // Лёгкое усиление чистоты только у хроматических цветов (глубокие тёмные остаются глубокими!)
    merged.forEach(function (m) {
      if (m.ch > 0.045) { m.a *= 1.09; m.b *= 1.09; m.ch *= 1.09; }
      m.c = oklab2rgb(m.L, m.a, m.b);
    });

    // Гармоничный порядок в замкнутом кольце (жадный ближайший сосед в OKLab от самого тёмного)
    merged.sort(function (x, y) { return x.L - y.L; });
    var ring = [merged.shift()];
    while (merged.length) {
      var prev = ring[ring.length - 1], bi = 0, bd = 1e9;
      for (var i = 0; i < merged.length; i++) {
        var m = merged[i], dL = prev.L - m.L, da = prev.a - m.a, db = prev.b - m.b;
        var dd = dL * dL + da * da + db * db;
        if (dd < bd) { bd = dd; bi = i; }
      }
      ring.push(merged.splice(bi, 1)[0]);
    }

    // Веса: мягкий степенной баланс (доминирующие цвета ведут, акценты не теряются)
    var s = 0;
    ring.forEach(function (e) { e.w = Math.pow(e.share, 0.68); s += e.w; });
    ring.forEach(function (e) { e.w /= s; });
    var FL = 0.045, low = ring.filter(function (e) { return e.w < FL; }), hi = ring.filter(function (e) { return e.w >= FL; });
    if (low.length && hi.length) {
      var hs = 0; hi.forEach(function (e) { hs += e.w; });
      var room = 1 - low.length * FL;
      hi.forEach(function (e) { e.w = e.w / hs * room; });
      low.forEach(function (e) { e.w = FL; });
    }
    var out = ring.map(function (e) { return { c: e.c, w: e.w }; });
    if (out.length === 1) out.push({ c: out[0].c.slice(), w: 0 });
    return out;
  }

  // Палитра волн 256x1 с перцептивным смешиванием границ в OKLab (без грязных серых стыков)
  function buildWavePaletteBytes(pal) {
    var n = pal.length, N = 256, data = new Uint8Array(N * 4);
    var labs = pal.map(function (p) { return rgb2oklab(p.c[0], p.c[1], p.c[2]); });
    var starts = [], ends = [], acc = 0, blend = [];
    pal.forEach(function (p) { starts.push(acc); acc += p.w; ends.push(acc); });
    for (var i = 0; i < n; i++) {
      var j = (i + 1) % n;
      blend[i] = Math.min(0.055, 0.34 * Math.min(pal[i].w, pal[j].w));
    }
    function sstep(a, b, x) { var t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); }
    function mixLab(a, b, t) { return oklab2rgb(a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t); }

    for (var x = 0; x < N; x++) {
      var u = (x + 0.5) / N, s = 0;
      while (s < n - 1 && u >= ends[s]) s++;
      var col = pal[s].c, nx = (s + 1) % n, pv = (s - 1 + n) % n;
      if (u > ends[s] - blend[s]) col = mixLab(labs[s], labs[nx], sstep(ends[s] - blend[s], ends[s] + blend[s], u));
      if (u < starts[s] + blend[pv]) col = mixLab(labs[pv], labs[s], sstep(starts[s] - blend[pv], starts[s] + blend[pv], u));
      data[x * 4] = col[0]; data[x * 4 + 1] = col[1]; data[x * 4 + 2] = col[2]; data[x * 4 + 3] = 255;
    }
    return data;
  }

  function buildPaletteBytes(pal) {
    var n = pal.length, N = 256, data = new Uint8Array(N * 4);
    var starts = [], ends = [], acc = 0, blend = [];
    pal.forEach(function (p) { starts.push(acc); acc += p.w; ends.push(acc); });
    for (var i = 0; i < n; i++) {
      var j = (i + 1) % n;
      blend[i] = Math.min(0.035, 0.25 * Math.min(pal[i].w, pal[j].w));
    }
    function sstep(a, b, x) { var t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); }
    function mixc(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; }

    for (var x = 0; x < N; x++) {
      var u = (x + 0.5) / N, s = 0;
      while (s < n - 1 && u >= ends[s]) s++;
      var col = pal[s].c, nx = (s + 1) % n, pv = (s - 1 + n) % n;
      if (u > ends[s] - blend[s]) col = mixc(pal[s].c, pal[nx].c, sstep(ends[s] - blend[s], ends[s] + blend[s], u));
      if (u < starts[s] + blend[pv]) col = mixc(pal[pv].c, pal[s].c, sstep(starts[s] - blend[pv], starts[s] + blend[pv], u));
      data[x * 4] = col[0]; data[x * 4 + 1] = col[1]; data[x * 4 + 2] = col[2]; data[x * 4 + 3] = 255;
    }
    return data;
  }

  // Плавный переход к палитре нового трека
  function pushPalette(pal) {
    var useV1 = state.wavePalMode === 'v1';
    var wpal = useV1 ? pal : (state.wavePalette || pal);
    blobsSetPalette(pal);
    w2SetPalette(wpal);
    if (!wave.ok) return;
    if (wave.mixStart >= 0) wave.cur = 1 - wave.cur; // переход ещё шёл — зафиксировать его результат
    upload(1 - wave.cur, useV1 ? buildPaletteBytes(wpal) : buildWavePaletteBytes(wpal));
    wave.mixStart = performance.now();
  }

  function drawWaves(now) {
    var dt = Math.min(0.1, (now - wave.last) / 1000);
    wave.last = now;
    wave.t += dt * wave.speed;

    var m = 0;
    if (wave.mixStart >= 0) {
      m = Math.min(1, (now - wave.mixStart) / 1800);
      if (m >= 1) { wave.cur = 1 - wave.cur; wave.mixStart = -1; m = 0; }
    }
    var gl = wave.gl;
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, wave.tex[wave.cur]);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, wave.tex[1 - wave.cur]);
    gl.uniform2f(wave.u.uRes, gl.canvas.width, gl.canvas.height);
    gl.uniform1f(wave.u.uTime, wave.t);
    gl.uniform1f(wave.u.uScale, wave.scale);
    gl.uniform1f(wave.u.uAngle, wave.angle);
    gl.uniform1f(wave.u.uChaos, wave.chaos);
    gl.uniform1f(wave.u.uZoom, wave.zoom);
    gl.uniform1f(wave.u.uMix, m);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }

  /* ================= Волны 2 (бета): больше линий, крупные хаотичные вихри и складки; доминирующие цвета обложки получают больше места ================= */
  var w2 = { gl: null, tex: [null, null], cur: 0, mixStart: -1, t: 0, last: performance.now(),
             speed: 1, scale: 2.2, chaos: 1.2, zoom: 1, angle: 55 * Math.PI / 180, dom: 0.6, ok: false, u: {} };

  // Палитра с приоритетом: ширина цвета ~ его доля на обложке в степени (1 + 3*dom); редкие цвета остаются, но тонкими полосками (минимум 2.5%)
  function w2Weighted(pal) {
    var e = 1 + w2.dom * 3, s = 0, a = pal.map(function (p) {
      var w = Math.pow(Math.max(p.w, 1e-4), e); s += w; return { c: p.c, w: w };
    });
    a.forEach(function (p) { p.w /= s; });
    var FL = 0.025, low = a.filter(function (p) { return p.w < FL; }), hi = a.filter(function (p) { return p.w >= FL; });
    if (low.length && hi.length) {
      var hs = 0; hi.forEach(function (p) { hs += p.w; });
      var room = 1 - low.length * FL;
      hi.forEach(function (p) { p.w = p.w / hs * room; });
      low.forEach(function (p) { p.w = FL; });
    }
    return a;
  }

  function w2Resize() {
    var c = $('waves2');
    c.width  = Math.max(2, Math.floor((innerWidth + 160) * 0.7));
    c.height = Math.max(2, Math.floor((innerHeight + 160) * 0.7));
    if (w2.gl) w2.gl.viewport(0, 0, c.width, c.height);
  }

  function w2Upload(i, bytes) {
    var gl = w2.gl;
    gl.bindTexture(gl.TEXTURE_2D, w2.tex[i]);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 256, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, bytes);
  }

  function w2SetPalette(pal) {
    if (!w2.ok || !pal || !pal.length) return;
    if (w2.mixStart >= 0) w2.cur = 1 - w2.cur;
    var weighted = w2Weighted(pal);
    w2Upload(1 - w2.cur, state.wavePalMode === 'v1' ? buildPaletteBytes(weighted) : buildWavePaletteBytes(weighted));
    w2.mixStart = performance.now();
  }

  function initWaves2() {
    var c = $('waves2');
    var gl = c.getContext('webgl', { antialias: false, alpha: false });
    if (!gl) return;
    var vs = 'attribute vec2 p; void main(){ gl_Position = vec4(p, 0.0, 1.0); }';
    var fs = `
precision highp float;
uniform vec2 uRes;
uniform float uTime, uScale, uMix, uAngle, uChaos, uZoom;
uniform sampler2D uCur, uNew;

float hash(vec2 p){
  p = fract(p * vec2(123.34, 456.21));
  p += dot(p, p + 45.32);
  return fract(p.x * p.y);
}
float vnoise(vec2 p){
  vec2 i = floor(p), f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  float a = hash(i), b = hash(i + vec2(1.0, 0.0));
  float c = hash(i + vec2(0.0, 1.0)), d = hash(i + vec2(1.0, 1.0));
  return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
}
float fbm(vec2 p){
  float v = 0.0, a = 0.5;
  for (int i = 0; i < 4; i++){
    v += a * vnoise(p);
    p = p * 2.03 + vec2(17.1, 9.2);
    a *= 0.5;
  }
  return v;
}
mat2 rot(float a){ float c = cos(a), s = sin(a); return mat2(c, -s, s, c); }
vec3 pal(float s){
  return mix(texture2D(uCur, vec2(s, 0.5)).rgb, texture2D(uNew, vec2(s, 0.5)).rgb, uMix);
}

void main(){
  vec2 p = (gl_FragCoord.xy - 0.5 * uRes) / uRes.y * 1.9 * uZoom;
  float t = uTime, C = uChaos;

  // крупные вихри: четыре медленно плавающих центра закручивают поле, получаются большие петли и воронки
  for (int i = 0; i < 4; i++){
    float fi = float(i);
    vec2 c = vec2(sin(t * 0.031 + fi * 1.9 + 0.7), cos(t * 0.027 + fi * 2.3 + 1.1)) * 1.1 * uZoom;
    vec2 d = p - c;
    float r2 = dot(d, d) / (uZoom * uZoom);
    float a = C * 1.1 * exp(-r2 * 0.5) * sin(t * 0.05 + fi * 1.7 + 0.3);
    p = c + rot(a) * d;
  }

  // двойное искажение шумом: крупные и средние хаотичные изгибы
  vec2 q = p;
  q += C * 0.55 * (vec2(fbm(q * 0.55 + vec2(t * 0.020, 3.1)), fbm(q * 0.55 + vec2(9.7, t * 0.017))) - 0.5) * 2.0;
  q += C * 0.28 * (vec2(fbm(q * 1.3 + vec2(-t * 0.030, 1.7)), fbm(q * 1.3 + vec2(4.4, t * 0.026))) - 0.5) * 2.0;

  vec2 dir = vec2(cos(uAngle), sin(uAngle));
  vec2 nrm = vec2(sin(uAngle), -cos(uAngle));
  float x = dot(q, nrm);
  float y = dot(q, dir) * 0.6;
  x += 0.30 * sin(1.7 * y + 1.1 * x + t * 0.11);
  y += 0.30 * sin(1.3 * x - 0.8 * y - t * 0.09 + 2.0);
  x += 0.20 * sin(3.1 * y + 2.0 * x - t * 0.15 + 4.0);
  float f = x + 0.12 * sin(5.0 * x + 1.3 * y + t * 0.18);

  // неравномерный шаг линий: где-то густо, где-то широкие полосы одного цвета
  float big = fbm(vec2(f * 0.35, y * 0.35) + vec2(t * 0.012, 7.0)) - 0.5;
  float s = f * 2.2 * uScale
          + C * 1.2 * big
          + C * 0.8 * (fbm(q * 0.4 + 13.0) - 0.5)
          + t * 0.03;
  vec3 c = pal(s);

  // тонкие блики и тёмные линии
  float ph = s * 6.2831853;
  float br = pow(0.5 + 0.5 * sin(ph * 2.0 + 0.7), 48.0);

  function fusePts(bx, by, bw, bh, rr) {
    var pts = [], cx = bx + bw / 2, i, a, N = 14;
    function line(x0, y0, x1, y1) { var n = Math.max(1, Math.ceil(Math.hypot(x1 - x0, y1 - y0) / 8)); for (i = 0; i < n; i++) pts.push([x0 + (x1 - x0) * i / n, y0 + (y1 - y0) * i / n]); }
    function arc(ax, ay, a0) { for (i = 0; i < N; i++) { a = a0 + Math.PI / 2 * i / N; pts.push([ax + rr * Math.cos(a), ay + rr * Math.sin(a)]); } }
    line(cx, by, bx + bw - rr, by); arc(bx + bw - rr, by + rr, -Math.PI / 2);
    line(bx + bw, by + rr, bx + bw, by + bh - rr); arc(bx + bw - rr, by + bh - rr, 0);
    line(bx + bw - rr, by + bh, bx + rr, by + bh); arc(bx + rr, by + bh - rr, Math.PI / 2);
    line(bx, by + bh - rr, bx, by + rr); arc(bx + rr, by + rr, Math.PI);
    line(bx + rr, by, cx, by); pts.push([cx, by]);
    return pts;
  }
  function drawFuse(now, r, p) {
    var c = $('fuse'), x = fuse.ctx, dt = Math.min(0.1, (now - fuse.last) / 1000), i, k;
    fuse.last = now;
    x.clearRect(0, 0, c.width, c.height);
    var fw = fuse.w, gap = fw * 1.4 + 6, bw = r.width + 2 * gap, bh = r.height + 2 * gap;
    var cr = cov.shape === 'rounded' ? cov.r : 50, rr = Math.min(Math.min(bw, bh) / 2, cr / 100 * r.width + gap);
    var pts = fusePts(r.left - gap, r.top - gap, bw, bh, rr), cum = [0];
    for (i = 1; i < pts.length; i++) cum.push(cum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
    var s = p * cum[cum.length - 1];
    k = 1; while (k < cum.length - 1 && cum[k] < s) k++;
    var tt = Math.min(1, Math.max(0, (s - cum[k - 1]) / (cum[k] - cum[k - 1] || 1)));
    var tx = pts[k - 1][0] + (pts[k][0] - pts[k - 1][0]) * tt, ty = pts[k - 1][1] + (pts[k][1] - pts[k - 1][1]) * tt;
    var rest = [[tx, ty]].concat(pts.slice(k));      // непрогоревшая часть: от огонька до конца круга
    function path(a) { x.beginPath(); x.moveTo(a[0][0], a[0][1]); for (var q = 1; q < a.length; q++) x.lineTo(a[q][0], a[q][1]); x.stroke(); }
    if (p < 1) {
      x.lineCap = 'round'; x.lineJoin = 'round';
      x.strokeStyle = 'rgba(0,0,0,.4)'; x.lineWidth = fw + 3; path(rest);
      x.strokeStyle = 'rgb(' + progRgb + ')'; x.lineWidth = fw; path(rest);
      x.save(); x.setLineDash([1.5, fw * 0.8]); x.strokeStyle = 'rgba(0,0,0,.3)'; path(rest); x.restore();     // «скрутка» каната
      var ch = [[tx, ty]], dsum = 0;                                                                         // обугленный кончик
      for (i = k; i < pts.length && dsum < fw * 3; i++) { dsum += Math.hypot(pts[i][0] - ch[ch.length - 1][0], pts[i][1] - ch[ch.length - 1][1]); ch.push(pts[i]); }
      if (ch.length > 1) { x.strokeStyle = 'rgba(20,12,8,.75)'; x.lineWidth = fw; path(ch); }
      var fl = 0.8 + 0.2 * Math.sin(now * 0.03) + 0.1 * Math.sin(now * 0.071), R = fw * (2.2 * fl + 1.5);      // пламя
      var gr = x.createRadialGradient(tx, ty, 0, tx, ty, R * 2);
      gr.addColorStop(0, 'rgba(255,250,200,1)'); gr.addColorStop(0.25, 'rgba(255,200,80,.9)'); gr.addColorStop(0.6, 'rgba(255,110,20,.35)'); gr.addColorStop(1, 'rgba(255,60,0,0)');
      x.globalCompositeOperation = 'lighter'; x.fillStyle = gr; x.beginPath(); x.arc(tx, ty, R * 2, 0, 6.2832); x.fill();
      if (fuse.fx && state.playing && fuse.sp.length < 80) {
        var n = Math.random() < 0.7 ? 1 : 2;
        while (n--) { var an = Math.random() * 6.2832, sp = 40 + Math.random() * 90; fuse.sp.push({ x: tx, y: ty, vx: Math.cos(an) * sp, vy: Math.sin(an) * sp - 50, life: 0.4 + Math.random() * 0.6 }); }
      }
    }
    x.globalCompositeOperation = 'lighter';
    for (i = fuse.sp.length - 1; i >= 0; i--) {     // искры
      var q = fuse.sp[i]; q.life -= dt;
      if (q.life <= 0) { fuse.sp.splice(i, 1); continue; }
      q.x += q.vx * dt; q.y += q.vy * dt; q.vy += 120 * dt;
      x.globalAlpha = Math.min(1, q.life * 2); x.fillStyle = '#ffc060'; x.beginPath(); x.arc(q.x, q.y, 1.2 + q.life, 0, 6.2832); x.fill();
    }
    x.globalAlpha = 1; x.globalCompositeOperation = 'source-over';
  }

  function updateCoverFx(now) {                      // каждый кадр: пластинка, прогресс-бар и фитиль следуют за положением обложки
    var r = coverEl.getBoundingClientRect(), vis = r.width > 20 && coverEl.style.opacity !== '0';
    var vd = $('vdisc'), vOn = vis && cov.shape === 'vinyl';
    if (vOn) {
      vd.style.left = r.left + 'px'; vd.style.top = r.top + 'px'; vd.style.width = r.width + 'px'; vd.style.height = r.height + 'px';
      var s = coverEl.getAttribute('src') || '';
      if (s !== cov.src) { cov.src = s; $('vlabel').style.backgroundImage = s ? 'url("' + s.replace(/"/g, '%22') + '")' : 'none'; }
      var pl = state.playing ? 'running' : 'paused';
      if (pl !== cov.play) { cov.play = pl; vd.style.setProperty('--vplay', pl); }
    }
    var want = vOn ? 'block' : 'none'; if (vd.style.display !== want) vd.style.display = want;
    var p = updateProg(), fOn = vis && p >= 0 && progStyle === 'fuse', fc = $('fuse');
    if (fOn) { if (fc.style.display !== 'block') fc.style.display = 'block'; drawFuse(now, r, p); }
    else if (fc.style.display !== 'none') { fc.style.display = 'none'; fuse.sp.length = 0; }
  }

  function fxResize() {
    var m = $('mesh'); m.width = 256; m.height = Math.max(2, Math.round(256 * innerHeight / innerWidth));
    ['snow', 'fuse'].forEach(function (id) { var c = $(id); c.width = innerWidth; c.height = innerHeight; });
  }
  function fxInit() {
    mesh.ctx = $('mesh').getContext('2d'); snow.ctx = $('snow').getContext('2d');
    fxResize(); window.addEventListener('resize', fxResize);
    meshColors(); applyMeshFx(); applyBlurBg(); applyShape();
  }

  /* ================= Синхронизация и цикл отрисовки ================= */
  function currentPos() {
    var p = state.basePos;
    if (state.playing) p += (performance.now() - state.baseTime) / 1000;
    return p + state.offset;
  }

  function findActive(pos) {
    var L = state.lyrics, lo = 0, hi = L.length - 1, ans = -1;
    while (lo <= hi) {
      var mid = (lo + hi) >> 1;
      if (L[mid].t <= pos) { ans = mid; lo = mid + 1; } else hi = mid - 1;
    }
    return ans;
  }

  // Раскладка: обложка слева, пока есть текст. По центру: нет текста, ничего не играет или трек закончился.
  var lastCentered = true;
  function trackEnded() {
    return !!state.title && state.duration > 0 && (currentPos() - state.offset) >= state.duration - 0.6;
  }
  function updateLayout() {
    var centered;
    if (trackEnded() || state.lyricsState === 'none') centered = true;
    else if (state.lyricsState === 'found') centered = false;
    else centered = lastCentered;                    // текст ещё ищем: остаёмся как были, без метаний влево-вправо
    if (centered !== lastCentered) { lastCentered = centered; appEl.classList.toggle('centered', centered); }
  }

  // HD не нашлась (поиск закончен): есть миниатюра -> обложка плавно уменьшается; нет никакой -> складывается, название едет на её место
  function updateCoverSize() {
    var mode = coverMode;
    if (!dev.shrink || !state.title || state.hdShown) mode = '';
    else if (state.hdDone && performance.now() - state.changeAt > 1800) {
      var fresh = state.thumbAt > state.changeAt - 1200 && state.thumbImg && !state.thumbLogo;
      mode = fresh ? 'small' : 'none';
    }
    if (mode !== coverMode) {
      coverMode = mode; var l = $('left');
      l.classList.toggle('cover-small', mode === 'small'); l.classList.toggle('cover-none', mode === 'none');
    }
  }

  function frame(now) {
    if (state.lyrics.length) {
      var pos = currentPos(), idx = findActive(pos);
      // строка не откатывается назад из-за дрожания позиции; назад — только при реальной перемотке
      if (idx < state.activeIdx && state.activeIdx >= 0 && pos > state.lastPos - 1.0) idx = state.activeIdx;
      state.lastPos = pos;
      if (idx !== state.activeIdx) {
        state.activeIdx = idx;
        state.lineEls.forEach(function (el, i) {
          el.classList.toggle('active', i === idx);
          el.classList.toggle('past', i < idx);
          el.classList.toggle('future', i > idx);
        });
        var el = state.lineEls[Math.max(idx, 0)];
        if (el) {
          var lyrH = ($('lyrics') && $('lyrics').clientHeight) || innerHeight;
          var center = el.offsetTop + el.offsetHeight / 2;
          trackEl.style.transform = 'translateY(' + (lyrH / 2 - center) + 'px)';
        }
      }
      updateReveal(pos, idx);
    }
    updateLayout();
    updateCoverSize();
    updateCoverFx(now);
    drawEq();
    if (wave.ok && state.bgMode === 'waves') drawWaves(now);
    else if (w2.ok && state.bgMode === 'waves2') drawWaves2(now);
    else if (w3.ok && state.bgMode === 'waves3') drawWaves3(now);
    else if (state.bgMode === 'blobs') drawBlobs(now);
    else if (state.bgMode === 'stars') drawStars(now);
    else if (state.bgMode === 'mesh') drawMesh(now);
    else if (state.bgMode === 'snow') drawSnow(now);
    else if (state.bgMode === 'blurcover') updateBlurBg();
    requestAnimationFrame(frame);
  }

  try { localStorage.removeItem('sp_rt'); } catch (e) {}   // очистка старого токена
  // Кнопки управления воспроизведением на экране
  (function initMediaControls() {
    var map = { btnPrev: 'prev', btnPlay: 'playpause', btnNext: 'next' };
    Object.keys(map).forEach(function (id) {
      var btn = $(id); if (!btn) return;
      btn.addEventListener('click', function () {
        btn.classList.add('pulse');
        setTimeout(function () { btn.classList.remove('pulse'); }, 180);
        if (typeof window.slwMediaControl === 'function') window.slwMediaControl(map[id]);
      });
    });
    // если нет нативного моста (например, обычный браузер/WE), скрываем кнопки управления
    if (typeof window.slwMediaControl !== 'function') $('mctrl').classList.add('hidden');
    // клик по прогресс-бару — перемотка трека (в окне и на рабочем столе)
    function handleSeekRatio(ratio) {
      if (!state.title || state.duration <= 0) return;
      var target = Math.max(0, Math.min(state.duration, ratio * state.duration));
      state.basePos = target;
      state.baseTime = performance.now();
      state.lastPos = target + state.offset;
      if (typeof window.slwMediaSeek === 'function') window.slwMediaSeek(target);
    }
    window.__slwHandleSeekRatio = handleSeekRatio;
    var pb = $('pbar');
    if (pb) {
      pb.addEventListener('click', function (ev) {
        var r = pb.getBoundingClientRect();
        if (!r.width) return;
        handleSeekRatio(Math.max(0, Math.min(1, (ev.clientX - r.left) / r.width)));
      });
    }
  })();
  var lastPlayIcon = null;
  function syncMediaCtrlIcon() {
    if (lastPlayIcon === state.playing) return;
    lastPlayIcon = state.playing;
    var ip = $('icoPlay'), ipa = $('icoPause');
    if (ip) ip.style.display = state.playing ? 'none' : 'block';
    if (ipa) ipa.style.display = state.playing ? 'block' : 'none';
  }
  setInterval(syncMediaCtrlIcon, 200);
  initWaves();
  initBlobs();
  initWaves2();
  initWaves3();
  fxInit();
  applyLang();
  setInterval(updateClock, 250);
  applyTheme();
  idleRefresh();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
